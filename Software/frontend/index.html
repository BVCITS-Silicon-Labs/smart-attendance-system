<!doctype html>

<html>
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Face Attendance</title>

<style>

:root{
  --primary:#3b82f6;
  --primary-dark:#1d4ed8;
  --primary-bright:#60a5fa;
  --primary-soft:rgba(59,130,246,.14);

  --cyan:#22d3ee;
  --cyan-soft:rgba(34,211,238,.14);

  --violet:#8b5cf6;
  --violet-soft:rgba(139,92,246,.16);

  --magenta:#ec4899;
  --magenta-soft:rgba(236,72,153,.14);

  --success:#10b981;
  --success-soft:rgba(16,185,129,.14);
  --danger:#f43f5e;
  --danger-soft:rgba(244,63,94,.14);
  --warning:#f59e0b;
  --warning-soft:rgba(245,158,11,.14);
  --info:#818cf8;
  --info-soft:rgba(129,140,248,.14);

  --bg:#0a0e1a;
  --surface:rgba(255,255,255,.045);
  --surface-solid:#121829;
  --surface-soft:rgba(255,255,255,.025);
  --border:rgba(255,255,255,.09);
  --border-soft:rgba(255,255,255,.06);

  --text:#eef2fb;
  --text-soft:#aab4cc;
  --muted:#7c88a6;

  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 22px 55px rgba(0,0,0,.45);
  --glow-blue:0 0 0 1px rgba(59,130,246,.25),0 10px 30px rgba(37,99,235,.18);

  --radius:18px;
  --radius-sm:12px;
}

*{
  box-sizing:border-box;
}

::selection{
  background:var(--violet-soft);
  color:#fff;
}

::-webkit-scrollbar{
  width:10px;
  height:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.12);
  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(255,255,255,.2);
}

body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(720px 420px at 8% -6%,rgba(59,130,246,.16),transparent 60%),
    radial-gradient(680px 460px at 96% 8%,rgba(139,92,246,.14),transparent 55%),
    radial-gradient(600px 500px at 50% 110%,rgba(34,211,238,.08),transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  transition:.2s ease;
}

button:active{
  transform:scale(.98);
}

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--cyan);
  outline-offset:2px;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:30px 20px 48px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:26px;
}

.brand{
  display:flex;
  align-items:center;
  gap:15px;
}

.brand-icon{
  width:50px;
  height:50px;
  border-radius:15px;
  display:grid;
  place-items:center;
  color:white;
  font-size:24px;
  font-weight:800;
  background:linear-gradient(145deg,var(--primary) 0%,var(--violet) 100%);
  box-shadow:0 10px 26px rgba(99,102,241,.35),inset 0 1px 0 rgba(255,255,255,.25);
}

.brand h1{
  margin:0;
  font-size:23px;
  font-weight:700;
  letter-spacing:-.4px;
  color:#fff;
}

.brand .muted{
  margin-top:3px;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

/* NAV */

nav{
  display:flex;
  gap:4px;
  padding:5px;
  background:var(--surface);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:var(--shadow);
}

nav button{
  background:transparent;
  color:var(--text-soft);
  padding:9px 15px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}

nav button:hover{
  background:var(--primary-soft);
  color:var(--primary-bright);
}

/* CARDS */

.card{
  background:var(--surface);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  margin-top:16px;
  box-shadow:var(--shadow);
  transition:border-color .25s ease,box-shadow .25s ease;
}

.card h2{
  margin:0 0 5px;
  font-size:18px;
  font-weight:700;
  letter-spacing:-.2px;
  color:#fff;
}

.card p{
  color:var(--text-soft);
  line-height:1.6;
}

.card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:16px;
}

/* STAT GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat-card{
  position:relative;
  overflow:hidden;
  padding:21px;
  min-height:125px;
}

.stat-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
  background:linear-gradient(90deg,var(--primary),var(--cyan));
}

.stat-card::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:-45px;
  bottom:-55px;
  border-radius:50%;
  background:var(--primary-soft);
  filter:blur(2px);
}

.stat-card:hover{
  border-color:rgba(255,255,255,.16);
  box-shadow:var(--shadow-lg);
}

.grid .stat-card:nth-child(1)::before{
  background:linear-gradient(90deg,var(--primary),var(--cyan));
}

.grid .stat-card:nth-child(1) .stat-icon{
  background:var(--primary-soft);
  color:var(--primary-bright);
}

.grid .stat-card:nth-child(1)::after{
  background:var(--primary-soft);
}

.grid .stat-card:nth-child(2)::before{
  background:linear-gradient(90deg,var(--success),#34d399);
}

.grid .stat-card:nth-child(2) .stat-icon{
  background:var(--success-soft);
  color:var(--success);
}

.grid .stat-card:nth-child(2)::after{
  background:var(--success-soft);
}

.grid .stat-card:nth-child(3)::before{
  background:linear-gradient(90deg,var(--warning),var(--magenta));
}

.grid .stat-card:nth-child(3) .stat-icon{
  background:var(--warning-soft);
  color:var(--warning);
}

.grid .stat-card:nth-child(3)::after{
  background:var(--warning-soft);
}

.grid .stat-card:nth-child(4)::before{
  background:linear-gradient(90deg,var(--violet),var(--magenta));
}

.grid .stat-card:nth-child(4) .stat-icon{
  background:var(--violet-soft);
  color:var(--violet);
}

.grid .stat-card:nth-child(4)::after{
  background:var(--violet-soft);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:var(--primary-soft);
  color:var(--primary-bright);
  font-size:18px;
}

.stat{
  margin-top:14px;
  font-size:30px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1px;
  color:#fff;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

/* BUTTONS */

.btn-primary{
  padding:11px 18px;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(135deg,var(--primary) 0%,var(--violet) 100%);
  box-shadow:0 6px 18px rgba(99,102,241,.28);
  font-weight:600;
}

.btn-primary:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 24px rgba(99,102,241,.38);
}

.btn-secondary{
  padding:11px 18px;
  border-radius:11px;
  color:var(--text);
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  font-weight:600;
}

.btn-secondary:hover{
  background:rgba(255,255,255,.11);
  border-color:rgba(255,255,255,.18);
}

.btn-danger{
  padding:11px 18px;
  border-radius:11px;
  color:#fda4af;
  background:var(--danger-soft);
  border:1px solid rgba(244,63,94,.25);
  font-weight:600;
}

/* DASHBOARD HERO */

.dashboard-hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
}

.dashboard-copy h2{
  font-size:22px;
  font-weight:700;
  margin:0 0 7px;
  color:#fff;
}

.dashboard-copy p{
  margin:0;
  max-width:650px;
}

.action-row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

/* STATUS */

.status-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status-active{
  background:var(--success-soft);
  color:#34d399;
  border:1px solid rgba(16,185,129,.3);
}

.status-inactive{
  background:rgba(255,255,255,.06);
  color:var(--muted);
  border:1px solid var(--border-soft);
}

/* FORMS */

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.form label{
  display:flex;
  flex-direction:column;
  gap:7px;
  color:var(--text-soft);
  font-size:13px;
  font-weight:600;
}

.form input{
  width:100%;
  padding:11px 13px;
  border:1px solid var(--border);
  border-radius:11px;
  background:rgba(255,255,255,.04);
  color:var(--text);
  outline:none;
  transition:.2s;
}

.form input::placeholder{
  color:var(--muted);
}

.form input:focus{
  border-color:var(--cyan);
  background:rgba(255,255,255,.06);
  box-shadow:0 0 0 3px rgba(34,211,238,.14);
}

.full{
  grid-column:1/-1;
}

.file-input{
  padding:10px !important;
  background:rgba(255,255,255,.03) !important;
}

/* TABLE */

.table-wrap{
  overflow-x:auto;
  margin-top:12px;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  min-width:650px;
}

th{
  padding:13px 14px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  font-weight:700;
  text-align:left;
  border-bottom:1px solid var(--border);
}

th:first-child{
  border-radius:10px 0 0 0;
}

th:last-child{
  border-radius:0 10px 0 0;
}

td{
  padding:13px 14px;
  border-bottom:1px solid var(--border-soft);
  color:var(--text-soft);
  font-size:13px;
}

td strong{
  color:var(--text);
}

tbody tr{
  transition:.15s;
}

tbody tr:hover{
  background:rgba(255,255,255,.035);
}

/* LIVE ATTENDANCE */

.live-card{
  padding:0;
  overflow:hidden;
}

.live-header{
  padding:20px 22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  background:rgba(255,255,255,.02);
}

.live-title{
  display:flex;
  align-items:center;
  gap:10px;
}

.live-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--success);
  box-shadow:0 0 0 5px var(--success-soft);
  animation:pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot{
  0%,100%{
    box-shadow:0 0 0 5px var(--success-soft);
  }
  50%{
    box-shadow:0 0 0 8px var(--success-soft);
  }
}

.camera-area{
  padding:18px;
  background:#050810;
}

video{
  display:block;
  width:100%;
  max-height:520px;
  min-height:300px;
  object-fit:contain;
  background:#020617;
  border-radius:13px;
  border:1px solid var(--border-soft);
}

.live-footer{
  padding:18px;
  background:transparent;
}

.result{
  padding:16px;
  margin-bottom:13px;
  background:var(--surface-soft);
  color:var(--text);
  border:1px solid var(--border);
  border-left:3px solid var(--cyan);
  border-radius:11px;
  line-height:1.65;
  font-size:13px;
}

.live-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

/* INFO STRIP */

.info-strip{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 15px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:11px;
  color:var(--text-soft);
  font-size:13px;
  margin-top:15px;
}

.info-icon{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border-radius:8px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
}

/* EMPTY / PAGE */

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  flex-wrap:wrap;
}

.page-title h2{
  margin:0;
  font-size:20px;
  font-weight:700;
  color:#fff;
}

.page-title p{
  margin:5px 0 0;
  font-size:13px;
  color:var(--text-soft);
}

/* MOBILE */

@media(max-width:900px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:750px){

  .wrap{
    padding:18px 13px 35px;
  }

  header{
    align-items:flex-start;
  }

  .brand h1{
    font-size:21px;
  }

  nav{
    width:100%;
    overflow-x:auto;
  }

  nav button{
    flex:1;
    white-space:nowrap;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    min-height:112px;
    padding:16px;
  }

  .stat{
    font-size:26px;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .card{
    padding:16px;
    border-radius:14px;
  }

  .dashboard-hero{
    align-items:flex-start;
  }

  .action-row{
    width:100%;
  }

  .action-row button{
    flex:1;
  }

  .live-header{
    padding:16px;
  }

  .camera-area{
    padding:10px;
  }

  video{
    min-height:230px;
  }

  .live-footer{
    padding:14px;
  }
}

@media(max-width:480px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .stat-icon{
    width:34px;
    height:34px;
    font-size:15px;
  }

  .stat-label{
    font-size:11px;
  }

  .stat{
    font-size:24px;
  }

  .brand-icon{
    width:42px;
    height:42px;
  }

  .action-row button{
    width:100%;
    flex:auto;
  }

}

</style>

</head>

<body>

<div class="wrap">

<header>

  <div class="brand">

    <div class="brand-icon">◉</div>

    <div>
      <h1>Smart Face Attendance</h1>
      <div class="muted">student local classroom system </div>
    </div>

  </div>

  <nav>
    <button onclick="show('dashboard')">Dashboard</button>
    <button onclick="show('live')">Live</button>
    <button onclick="show('students')">Students</button>
    <button onclick="show('attendance')">Attendance</button>
  </nav>

</header>

<main id="app"></main>

</div>

<script>

const app=document.getElementById('app');

let stream=null,
    scanning=false,
    timer=null;


const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[m]));


async function api(u,o){

  let r=await fetch(u,o);

  if(!r.ok)
    throw Error((await r.text()).slice(0,300));

  return r.json();

}


/* =========================================================
   DASHBOARD
   ========================================================= */

async function dashboard(){

  let d=await api('/api/dashboard');

  app.innerHTML=`

  <div class="grid">

    <div class="card stat-card">

      <div class="stat-top">

        <div class="stat-label">
          Students
        </div>

        <div class="stat-icon">
          👥
        </div>

      </div>

      <div class="stat">
        ${d.total_students}
      </div>

    </div>


    <div class="card stat-card">

      <div class="stat-top">

        <div class="stat-label">
          Present
        </div>

        <div class="stat-icon">
          ✓
        </div>

      </div>

      <div class="stat">
        ${d.present}
      </div>

    </div>


    <div class="card stat-card">

      <div class="stat-top">

        <div class="stat-label">
          Absent
        </div>

        <div class="stat-icon">
          ○
        </div>

      </div>

      <div class="stat">
        ${d.absent}
      </div>

    </div>


    <div class="card stat-card">

      <div class="stat-top">

        <div class="stat-label">
          SiWG917
        </div>

        <div class="stat-icon">
          ${d.device_online?'✓':'×'}
        </div>

      </div>

      <div class="stat">
        ${d.device_online?'Online':'Offline'}
      </div>

      <div class="muted" style="margin-top:6px">
        ${d.device_ip || ''}
      </div>

      <div style="margin-top:8px;font-weight:800">

        LED:
        ${(d.led_color || 'blue').toUpperCase()}

      </div>

    </div>

  </div>


  <div class="card">

    <div class="dashboard-hero">

      <div class="dashboard-copy">

        <h2>
          Today's Attendance
        </h2>

        <p>
          Manage classroom attendance using live face recognition.
          Only attendance date and time are saved.
        </p>

      </div>


      <div class="action-row">

        <button
          class="btn-primary"
          onclick="show('live')">

          Start Live Attendance

        </button>


        <button
          class="btn-secondary"
          onclick="location.href='/api/reports/csv'">

          Download CSV

        </button>

      </div>

    </div>


    <div class="info-strip">

      <div class="info-icon">
        🔒
      </div>

      <span>
        Daily webcam frames are processed for recognition and discarded.
      </span>

    </div>

  </div>

  `;

}


/* =========================================================
   STUDENTS
   ========================================================= */

async function students(){

  let a=await api('/api/students');

  app.innerHTML=`

  <div class="card">

    <div class="page-title">

      <div>

        <h2>
          New Student Registration
        </h2>

        <p class="muted">
          Add a student using their registration photo.
        </p>

      </div>

    </div>

    <br>


    <form id="f" class="form">

      <label>

        Student ID

        <input
          name="student_id"
          required>

      </label>


      <label>

        Roll Number

        <input
          name="roll_number"
          required>

      </label>


      <label>

        Name

        <input
          name="name"
          required>

      </label>


      <label>

        Class

        <input
          name="class_name"
          required>

      </label>


      <label>

        Section

        <input
          name="section"
          required>

      </label>


      <label>

        Department

        <input
          name="department">

      </label>


      <label class="full">

        Registration Photo

        <input
          name="image"
          type="file"
          accept="image/*"
          class="file-input"
          required>

      </label>


      <div class="full">

        <button class="btn-primary">
          Register Student
        </button>

      </div>

    </form>

  </div>


  <div class="card">

    <div class="card-head">

      <div>

        <h2>
          Students
        </h2>

        <div class="muted">
          ${a.length} registered students
        </div>

      </div>

    </div>


    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>Roll</th>
            <th>Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Status</th>

          </tr>

        </thead>


        <tbody>

          ${a.map(s=>`

            <tr>

              <td>
                ${esc(s.student_id)}
              </td>

              <td>
                ${esc(s.roll_number)}
              </td>

              <td>
                <strong>
                  ${esc(s.name)}
                </strong>
              </td>

              <td>
                ${esc(s.class_name)}
              </td>

              <td>
                ${esc(s.section)}
              </td>


              <td>

                <span
                  class="status-badge ${s.is_active?'status-active':'status-inactive'}">

                  ${s.is_active
                    ?'● Active'
                    :'● Inactive'}

                </span>

              </td>

            </tr>

          `).join('')}

        </tbody>

      </table>

    </div>

  </div>

  `;


  document.getElementById('f').onsubmit=async e=>{

    e.preventDefault();

    try{

      let r=await api('/api/students',{

        method:'POST',

        body:new FormData(e.target)

      });

      alert('Registered '+r.name);

      students();

    }

    catch(x){

      alert(x.message);

    }

  }

}


/* =========================================================
   LIVE ATTENDANCE
   ========================================================= */

async function live(){

  if(stream){

    stream
      .getTracks()
      .forEach(t=>t.stop());

  }


  app.innerHTML=`

  <div class="card live-card">

    <div class="live-header">

      <div class="live-title">

        <span class="live-dot"></span>

        <div>

          <h2 style="margin:0">
            Live Attendance
          </h2>

          <div class="muted">
            Face recognition camera
          </div>

        </div>

      </div>


      <span class="status-badge status-active">

        ● Camera Ready

      </span>

    </div>


    <div class="camera-area">

      <video
        id="v"
        autoplay
        muted
        playsinline>
      </video>

      <canvas
        id="c"
        hidden>
      </canvas>

    </div>


    <div class="live-footer">

      <div id="r" class="result">

        Starting camera...

      </div>


      <div class="live-actions">

        <button
          id="go"
          class="btn-primary">

          Start Scanning

        </button>


        <button
          id="stop"
          class="btn-secondary">

          Stop

        </button>

      </div>

    </div>

  </div>

  `;


  let v=document.getElementById('v'),
      r=document.getElementById('r');


  try{

    stream=await navigator.mediaDevices.getUserMedia({

      video:true,
      audio:false

    });

    v.srcObject=stream;

    r.textContent=
      'Camera ready. Start scanning to recognize students.';

  }

  catch(e){

    r.textContent=
      'Camera error: '+e.message;

    return;

  }


  /* Start scanning */

  document.getElementById('go').onclick=async ()=>{

    if(!scanning){

      scanning=true;


      /* Normal state = BLUE */

      try{

        await api(
          '/api/device/led/blue',
          {
            method:'POST'
          }
        );

      }

      catch(e){}


      loop();

    }

  };


  /* Stop scanning */

  document.getElementById('stop').onclick=async ()=>{

    scanning=false;

    clearTimeout(timer);


    /* Return to BLUE */

    try{

      await api(
        '/api/device/led/blue',
        {
          method:'POST'
        }
      );

    }

    catch(e){}


    r.innerHTML=
      '🔵 Scanning stopped — LED BLUE';

  };


  /* =======================================================
     FACE RECOGNITION LOOP
     ======================================================= */

  async function loop(){

    if(!scanning)
      return;


    let c=document.getElementById('c');


    c.width=v.videoWidth||640;

    c.height=v.videoHeight||480;


    c.getContext('2d').drawImage(

      v,
      0,
      0,
      c.width,
      c.height

    );


    c.toBlob(async b=>{

      if(!scanning)
        return;


      let f=new FormData();


      f.append(
        'image',
        b,
        'frame.jpg'
      );


      try{

        let x=await api(

          '/api/recognition/recognize',

          {
            method:'POST',
            body:f
          }

        );


        /* =================================================
           CORRECT / REGISTERED PERSON

           GREEN LED
           ================================================= */

        if(x.recognized){

          /*
           * NEW BACKEND:
           *
           * x.led.color
           * x.led.signal_sent
           *
           * OLD:
           *
           * x.esp32.signal_sent
           *
           * OLD ESP32 reference is completely removed.
           */


          const ledColor =
            x.led && x.led.color
              ? x.led.color.toLowerCase()
              : 'green';


          const ledIcon =
            ledColor === 'green'
              ? '🟢'
              : ledColor === 'red'
                ? '🔴'
                : '🔵';


          r.innerHTML=`

            <b style="font-size:15px">

              ✓ ${esc(x.student.name)}

            </b>

            <br>

            ${x.attendance.already_present
              ?'Already present today'
              :'PRESENT'}

            <br>

            Time:
            ${x.attendance.time}

            <br>

            Confidence:
            ${(x.confidence*100).toFixed(1)}%

            <br>

            SiWG917:
            ${ledIcon}
            ${ledColor.toUpperCase()}

          `;

        }


        /* =================================================
           UNKNOWN / NO FACE

           RED = Unknown
           BLUE = No face / normal
           ================================================= */

        else{

          const color =
            x.led && x.led.color
              ? x.led.color.toLowerCase()
              : 'blue';


          const icon =
            color === 'green'
              ? '🟢'
              : color === 'red'
                ? '🔴'
                : '🔵';


          r.innerHTML=`

            <b>
              ${icon}
              ${esc(
                x.message ||
                'No face detected'
              )}
            </b>

            <br>

            LED:

            <strong>
              ${color.toUpperCase()}
            </strong>

          `;

        }

      }


      catch(e){

        r.textContent=
          e.message;

      }


      timer=setTimeout(

        loop,

        1500

      );


    },'image/jpeg',.75);

  }

}
